name: Capstone CI/CD Pipeline

'on':
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI for instructor evaluation

jobs:
  # ============================================================================
  # STAGE 1: TEST
  # ============================================================================
  test:
    name: "Stage 1: Test & Code Quality"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests with Pytest
        run: |
          pytest -v tests/test_data_pipeline.py

  # ============================================================================
  # STAGE 2: BUILD
  # ============================================================================
  build:
    name: "Stage 2: Build & Push Container Image"
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # STAGE 3: DEPLOY
  # ============================================================================
  deploy:
    name: "Stage 3: Kubernetes Deployment & Rollout"
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Validate Kubernetes Manifests (Dry Run)
        run: |
          kubectl apply -f k8s/deployment.yaml --dry-run=client
          kubectl apply -f k8s/service.yaml --dry-run=client
          kubectl apply -f k8s/hpa.yaml --dry-run=client
          echo "✅ All Kubernetes declarative manifests are structurally valid!"

      - name: Emit Deployment Instructions & Image Release Note
        run: |
          echo "=========================================================="
          echo "🚀 RELEASE SUMMARY FOR LOCAL DOCKER DESKTOP KUBERNETES"
          echo "Image Built and Pushed:"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:latest"
          echo "  - ${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:${{ github.sha }}"
          echo ""
          echo "To update your running local cluster, run:"
          echo "  kubectl set image deployment/weather-dashboard weather-dashboard=${{ secrets.DOCKERHUB_USERNAME }}/weather-dashboard:${{ github.sha }}"
          echo "  kubectl rollout status deployment/weather-dashboard"
          echo "  kubectl get hpa"
          echo "=========================================================="
